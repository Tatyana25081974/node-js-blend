<!DOCTYPE html>
<!-- Вказуємо, що це HTML5 документ -->
<html>

<head>
    <!-- Встановлюємо кодування символів (UTF-8 підтримує всі мови, включно з українською) -->
    <meta charset="utf-8" />

    <!-- Заголовок сторінки, який відображається на вкладці браузера -->
    <title>API Reference | ReDoc</title>

    <!-- Налаштування для адаптивного дизайну: ширина екрану дорівнює ширині пристрою -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Фавікон — маленька іконка, яка показується у вкладці браузера -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <!-- Вбудовані стилі: обнуляємо зовнішні відступи сторінки -->
    <style>
        /* Скидання відступів і полів сторінки */
        body {
            margin: 0;
            padding: 0;
        }
    </style>

    <!-- Плейсхолдер: сюди Redoc автоматично вставить потрібні <link> та <script> -->
    {{{redocHead}}}
</head>

<body>
    <!-- Плейсхолдер: тут Redoc згенерує повний інтерфейс API-документації -->
    {{{redocHTML}}}
</body>

</html>
